name: Build Android Release APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      variant:
        description: 'Release APK variant to build'
        required: true
        default: 'standardRelease'
        type: choice
        options:
          - standardRelease
          - termuxRelease
          - allRelease

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'agy_ide_bridge/go.mod'

      - name: Ensure xz-utils is installed
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xz-utils
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks
          else
            rm -f app/release.jks
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias antigem \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Agent Gravity, OU=Mobile, O=Agent Gravity, L=Local, ST=Local, C=US"
          fi

      - name: Build Release APK(s)
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          VARIANT="${{ inputs.variant || 'standardRelease' }}"
          if [ "$VARIANT" = "allRelease" ]; then
            ./scripts/build_all_apks.sh --release
          elif [ "$VARIANT" = "termuxRelease" ]; then
            ./gradlew :app:assembleTermuxRelease --no-daemon
            mkdir -p output
            find app/build/outputs/apk/termux/release -name "*.apk" -exec cp {} output/ \;
          else
            ./gradlew :app:assembleStandardRelease --no-daemon
            mkdir -p output
            find app/build/outputs/apk/standard/release -name "*.apk" -exec cp {} output/ \;
          fi

      - name: List Built Release APKs
        run: ls -lh output/

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-gravity-release-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
